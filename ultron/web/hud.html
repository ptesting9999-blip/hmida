<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ULTRON</title>
<style>
  :root{
    --bg:#05060a; --bg2:#0a0d16;
    --core:#ff2d3f; --core-dim:#7a1620;
    --accent:#2de0ff; --accent-dim:#0c6b7e;
    --ok:#39ff88; --warn:#ffcc3a; --danger:#ff4b4b;
    --text:#e8edff; --muted:#7f8aa8;
    --font:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column}

  /* animated starfield / grid backdrop */
  #bg{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(1200px 800px at 50% 42%, rgba(255,45,63,.10), transparent 60%),
      radial-gradient(900px 700px at 80% 90%, rgba(45,224,255,.06), transparent 60%),
      linear-gradient(var(--bg),var(--bg2));}
  #grid{position:fixed;inset:0;z-index:0;opacity:.25;
    background-image:linear-gradient(rgba(45,224,255,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(45,224,255,.08) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(circle at 50% 45%,#000 20%,transparent 75%);
    animation:drift 40s linear infinite}
  @keyframes drift{to{background-position:440px 440px}}

  header{position:relative;z-index:3;display:flex;align-items:center;gap:14px;
    padding:16px 22px;letter-spacing:.35em}
  header .logo{font-weight:700;font-size:15px;color:var(--core);
    text-shadow:0 0 18px var(--core)}
  header .status{color:var(--muted);font-size:11px;letter-spacing:.25em;text-transform:uppercase}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--core);
    box-shadow:0 0 12px var(--core);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  header .spacer{flex:1}
  header .meta{color:var(--muted);font-size:10px;letter-spacing:.15em}

  main{position:relative;z-index:2;flex:1;display:grid;
    grid-template-columns:1fr minmax(320px,380px);min-height:0}
  @media(max-width:820px){main{grid-template-columns:1fr}}

  /* ---- the core ---- */
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;
    justify-content:center;min-height:0;padding:10px}
  #core{width:min(62vmin,460px);height:min(62vmin,460px);cursor:pointer;
    filter:drop-shadow(0 0 40px rgba(255,45,63,.35))}
  .corelabel{margin-top:20px;color:var(--muted);font-size:11px;letter-spacing:.3em;
    text-transform:uppercase;text-align:center;min-height:16px;transition:color .3s}
  .hint{margin-top:8px;color:var(--accent);font-size:11px;letter-spacing:.2em;opacity:.8}

  /* ---- side panel ---- */
  aside{position:relative;z-index:2;display:flex;flex-direction:column;
    border-left:1px solid rgba(45,224,255,.12);background:rgba(5,7,12,.55);
    backdrop-filter:blur(6px);min-height:0}
  @media(max-width:820px){aside{border-left:none;border-top:1px solid rgba(45,224,255,.12);
    max-height:40vh}}
  .panel-h{padding:12px 16px;font-size:10px;letter-spacing:.3em;color:var(--accent);
    text-transform:uppercase;border-bottom:1px solid rgba(45,224,255,.1)}
  #log{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  #log::-webkit-scrollbar{width:6px}#log::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:3px}
  .msg{font-size:13px;line-height:1.5;max-width:100%;word-wrap:break-word}
  .msg .who{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
  .msg.user{color:#cfe3ff}.msg.user .who{color:var(--accent)}
  .msg.ultron{color:#ffd9dc}.msg.ultron .who{color:var(--core)}
  .tool{font-size:11px;color:var(--muted);border-left:2px solid var(--accent-dim);
    padding:4px 0 4px 10px;white-space:pre-wrap}
  .tool b{color:var(--accent);font-weight:600}
  .tool.err{border-color:var(--danger);color:#ffb0b0}
  .think{font-size:11px;color:#8a7fd8;font-style:italic;opacity:.85}

  footer{position:relative;z-index:3;display:flex;gap:10px;align-items:center;
    padding:14px 18px;border-top:1px solid rgba(45,224,255,.1)}
  #entry{flex:1;background:rgba(10,14,22,.8);border:1px solid rgba(45,224,255,.2);
    color:var(--text);font-family:var(--font);font-size:13px;padding:12px 14px;border-radius:10px;outline:none}
  #entry:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(45,224,255,.12)}
  button{font-family:var(--font);cursor:pointer;border-radius:10px;border:1px solid transparent;
    padding:11px 16px;font-size:12px;letter-spacing:.1em;transition:.15s}
  .btn{background:rgba(45,224,255,.1);border-color:rgba(45,224,255,.3);color:var(--accent)}
  .btn:hover{background:rgba(45,224,255,.2)}
  .btn.mic.on{background:rgba(255,45,63,.18);border-color:var(--core);color:#ffc3c8;
    box-shadow:0 0 18px rgba(255,45,63,.4)}
  .btn.stop{background:rgba(255,75,75,.12);border-color:rgba(255,75,75,.4);color:#ffb0b0}

  /* approval modal */
  #modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
    background:rgba(2,3,6,.78);backdrop-filter:blur(4px)}
  #modal.show{display:flex}
  .card{width:min(520px,92vw);background:linear-gradient(var(--bg2),#070a12);
    border:1px solid rgba(255,45,63,.4);border-radius:16px;padding:22px;
    box-shadow:0 0 60px rgba(255,45,63,.25)}
  .card h3{margin:0 0 6px;color:var(--core);font-size:13px;letter-spacing:.2em;text-transform:uppercase}
  .card p{color:var(--muted);font-size:11px;margin:0 0 14px;letter-spacing:.1em}
  .card pre{background:#05070c;border:1px solid rgba(45,224,255,.15);border-radius:8px;
    padding:12px;color:#d8e6ff;font-size:12px;max-height:220px;overflow:auto;white-space:pre-wrap;margin:0 0 16px}
  .card .row{display:flex;gap:10px;justify-content:flex-end}
  .card .allow{background:rgba(57,255,136,.12);border-color:rgba(57,255,136,.4);color:var(--ok)}
  .card .deny{background:rgba(255,75,75,.12);border-color:rgba(255,75,75,.4);color:#ffb0b0}
</style>
</head>
<body>
  <div id="bg"></div><div id="grid"></div>

  <header>
    <span class="dot" id="statusDot"></span>
    <span class="logo">ULTRON</span>
    <span class="status" id="statusText">offline</span>
    <span class="spacer"></span>
    <span class="meta" id="meta"></span>
  </header>

  <main>
    <section class="stage">
      <canvas id="core" width="460" height="460"></canvas>
      <div class="corelabel" id="coreLabel">click to wake</div>
      <div class="hint" id="hint"></div>
    </section>

    <aside>
      <div class="panel-h">Activity</div>
      <div id="log"></div>
    </aside>
  </main>

  <footer>
    <button class="btn mic" id="mic" title="toggle voice">🎙 VOICE</button>
    <input id="entry" placeholder="type a command, or just talk…" autocomplete="off" />
    <button class="btn" id="send">SEND</button>
    <button class="btn stop" id="stop" title="interrupt">◼</button>
  </footer>

  <div id="modal">
    <div class="card">
      <h3 id="mTitle">Authorize action</h3>
      <p id="mName"></p>
      <pre id="mDetail"></pre>
      <div class="row">
        <button class="deny" id="mDeny">DENY</button>
        <button class="allow" id="mAllow">ALLOW</button>
      </div>
    </div>
  </div>

<script>
"use strict";
// ============================================================= core renderer
// An animated reactor the whole UI reacts to: energy rises when ULTRON is
// listening (driven by your mic level) or speaking/thinking (driven by a timer).
const cv = document.getElementById('core'), cx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
function sizeCore(){ const s = cv.clientWidth*DPR; cv.width=cv.height=s; }
let energy = 0, targetEnergy = 0, mode = 'idle', t = 0;
const palette = {
  idle:'#ff2d3f', listening:'#2de0ff', thinking:'#b36bff',
  acting:'#ffcc3a', speaking:'#ff2d3f'
};
function draw(){
  t += 0.016;
  energy += (targetEnergy - energy) * 0.12;
  const w = cv.width, h = cv.height, cxp = w/2, cyp = h/2;
  const base = Math.min(w,h)*0.30;
  const col = palette[mode] || palette.idle;
  cx.clearRect(0,0,w,h);

  // outer rotating rings
  for(let i=0;i<3;i++){
    const r = base*(1.15 + i*0.16) + Math.sin(t*1.3+i)*4*DPR;
    cx.save(); cx.translate(cxp,cyp); cx.rotate(t*(i%2?-0.4:0.4)+i);
    cx.beginPath();
    for(let a=0;a<Math.PI*2;a+=0.02){
      const jag = 1 + (i===0? energy*0.08*Math.sin(a*12+t*4):0);
      const x=Math.cos(a)*r*jag, y=Math.sin(a)*r*jag;
      a===0?cx.moveTo(x,y):cx.lineTo(x,y);
    }
    cx.closePath();
    cx.strokeStyle = col; cx.globalAlpha = 0.18 + i*0.06 + energy*0.25;
    cx.lineWidth = (i===0?2.4:1.2)*DPR; cx.shadowColor=col; cx.shadowBlur=18*DPR;
    cx.stroke(); cx.restore();
  }

  // audio-reactive radial bars
  const bars = 72;
  cx.save(); cx.translate(cxp,cyp);
  for(let i=0;i<bars;i++){
    const a = (i/bars)*Math.PI*2;
    const lvl = (spectrum[i% spectrum.length]||0)/255;
    const len = base*0.14*(0.4 + lvl*2.2 + energy*0.8);
    const r0 = base*0.72;
    cx.beginPath();
    cx.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
    cx.lineTo(Math.cos(a)*(r0+len), Math.sin(a)*(r0+len));
    cx.strokeStyle=col; cx.globalAlpha=0.5+lvl*0.5; cx.lineWidth=2*DPR;
    cx.shadowColor=col; cx.shadowBlur=10*DPR; cx.stroke();
  }
  cx.restore();

  // the eye / reactor core
  const pulse = base*(0.5 + Math.sin(t*2)*0.02 + energy*0.12);
  const g = cx.createRadialGradient(cxp,cyp,pulse*0.1,cxp,cyp,pulse);
  g.addColorStop(0,'#fff'); g.addColorStop(0.25,col);
  g.addColorStop(0.7,col+'55'); g.addColorStop(1,'transparent');
  cx.globalAlpha=1; cx.fillStyle=g; cx.shadowColor=col; cx.shadowBlur=60*DPR;
  cx.beginPath(); cx.arc(cxp,cyp,pulse,0,Math.PI*2); cx.fill();

  // inner iris slit (Ultron eye)
  cx.globalAlpha=0.9; cx.fillStyle='#05060a'; cx.shadowBlur=0;
  cx.beginPath(); cx.ellipse(cxp,cyp,pulse*0.34,pulse*0.5,0,0,Math.PI*2); cx.fill();
  cx.fillStyle=col; cx.globalAlpha=0.9; cx.shadowColor=col; cx.shadowBlur=30*DPR;
  cx.beginPath(); cx.ellipse(cxp,cyp,pulse*0.12,pulse*0.34,0,0,Math.PI*2); cx.fill();

  requestAnimationFrame(draw);
}
let spectrum = new Uint8Array(72);
window.addEventListener('resize', sizeCore); sizeCore(); draw();

function setMode(m){
  mode = m;
  const labels={idle:'standing by',listening:'listening…',thinking:'thinking…',
    acting:'working…',speaking:'speaking…'};
  document.getElementById('statusText').textContent = m;
  document.getElementById('coreLabel').textContent = labels[m]||m;
  document.getElementById('statusDot').style.background = palette[m]||palette.idle;
  document.getElementById('statusDot').style.boxShadow = '0 0 12px '+(palette[m]||palette.idle);
  targetEnergy = (m==='idle')?0.05 : (m==='listening'?0.5:0.85);
}

// ============================================================= mic analyser
let audioCtx, analyser, micStream;
async function startMicMeter(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    (function poll(){
      if(!analyser) return;
      analyser.getByteFrequencyData(data);
      spectrum = data.slice(0,72);
      requestAnimationFrame(poll);
    })();
  }catch(e){ log('tool','microphone blocked — you can still type.'); }
}

// ============================================================= speech (STT)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, micOn=false, speaking=false, wantMic=false;
function buildRecog(){
  if(!SR) return null;
  const r = new SR();
  r.continuous = true; r.interimResults = true; r.lang = 'en-US';
  r.onresult = (e)=>{
    let finalText='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
    }
    finalText = finalText.trim();
    if(finalText){ sendText(finalText); }
  };
  r.onend = ()=>{ if(wantMic && !speaking){ try{r.start();}catch(_){} } };
  r.onerror = ()=>{};
  return r;
}
function setMic(on){
  wantMic = on; micOn = on;
  document.getElementById('mic').classList.toggle('on', on);
  if(on){
    if(!recog) recog = buildRecog();
    if(recog){ try{recog.start();}catch(_){} setMode('listening'); }
    else log('tool','voice input needs Chrome/Edge. Typing still works.');
    startMicMeter();
  }else{
    if(recog){ try{recog.stop();}catch(_){} }
    setMode('idle');
  }
}

// ============================================================= speech (TTS)
let voices=[]; function loadVoices(){ voices = speechSynthesis.getVoices(); }
loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
let preferredVoice = null;
function pickVoice(){
  if(preferredVoice) return preferredVoice;
  const want = (window.ULTRON_VOICE||'').toLowerCase();
  preferredVoice = voices.find(v=>v.name.toLowerCase()===want)
    || voices.find(v=>/google (uk|us)/i.test(v.name))
    || voices.find(v=>/en-US/i.test(v.lang)) || voices[0] || null;
  return preferredVoice;
}
function speak(text){
  if(!('speechSynthesis' in window) || !text) return;
  // pause listening so ULTRON doesn't hear itself
  speaking = true; setMode('speaking');
  if(recog){ try{recog.stop();}catch(_){} }
  speechSynthesis.cancel();
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  let done = 0;
  parts.forEach((p)=>{
    const u = new SpeechSynthesisUtterance(p.trim());
    const v = pickVoice(); if(v) u.voice = v;
    u.rate = 1.02; u.pitch = 0.7; // a lower, calmer machine voice
    u.onend = ()=>{ if(++done>=parts.length){
      speaking=false;
      if(wantMic){ setMode('listening'); if(recog){try{recog.start();}catch(_){}} }
      else setMode('idle');
    }};
    speechSynthesis.speak(u);
  });
}

// ============================================================= websocket
let ws, wsReady=false, pendingReply='';
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.onopen = ()=>{ wsReady=true; setMode('idle'); };
  ws.onclose = ()=>{ wsReady=false; setMode('idle');
    document.getElementById('statusText').textContent='reconnecting'; setTimeout(connect,1500); };
  ws.onmessage = (ev)=>handle(JSON.parse(ev.data));
}
function handle(m){
  switch(m.type){
    case 'ready':
      document.getElementById('meta').textContent =
        (m.model||'') + (m.god_mode?'  ·  GOD MODE':'  ·  guarded'); break;
    case 'state': setMode(m.value); break;
    case 'token': pendingReply += m.text; liveReply(pendingReply); break;
    case 'thinking': if(m.text) log('think','↯ '+m.text); break;
    case 'tool': log('tool','▸ <b>'+m.name+'</b> '+fmtInput(m.input)); break;
    case 'tool_pending': setMode('acting'); break;
    case 'tool_result':
      log('tool'+(m.ok?'':' err'), (m.ok?'✓ ':'✗ ')+ (m.preview||'').slice(0,160)); break;
    case 'say': speak(m.text); break;
    case 'assistant_done':
      if(m.text){ commitReply(m.text); } pendingReply=''; break;
    case 'approval_request': askApproval(m); break;
    case 'error': log('tool err','! '+m.text); pendingReply=''; break;
  }
}
function fmtInput(o){ try{ const s=JSON.stringify(o); return s.length>120?s.slice(0,120)+'…':s; }catch(_){return ''} }

// ============================================================= transcript
const logEl = document.getElementById('log');
let liveEl = null;
function log(cls, html){
  const d=document.createElement('div');
  d.className = (cls==='think')?'think':(cls.startsWith('tool')?('tool'+(cls.includes('err')?' err':'')):'msg '+cls);
  d.innerHTML = html; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight;
  return d;
}
function logMsg(who, text){
  const d=document.createElement('div'); d.className='msg '+who;
  d.innerHTML='<span class="who">'+(who==='user'?'you':'ultron')+'</span>'+escapeHtml(text);
  logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; return d;
}
function liveReply(text){
  if(!liveEl) liveEl = logMsg('ultron','');
  liveEl.innerHTML='<span class="who">ultron</span>'+escapeHtml(text);
  logEl.scrollTop=logEl.scrollHeight;
}
function commitReply(text){ if(!liveEl) logMsg('ultron',text);
  else liveEl.innerHTML='<span class="who">ultron</span>'+escapeHtml(text); liveEl=null; }
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ============================================================= send
function sendText(text){
  if(!wsReady){ log('tool err','! not connected yet'); return; }
  speechSynthesis.cancel();
  logMsg('user', text); pendingReply='';
  ws.send(JSON.stringify({type:'user_text', text}));
}
document.getElementById('send').onclick = ()=>{
  const e=document.getElementById('entry'); const v=e.value.trim();
  if(v){ sendText(v); e.value=''; }
};
document.getElementById('entry').addEventListener('keydown',(ev)=>{
  if(ev.key==='Enter'){ document.getElementById('send').click(); }
});
document.getElementById('mic').onclick = ()=>setMic(!micOn);
document.getElementById('stop').onclick = ()=>{
  speechSynthesis.cancel(); speaking=false;
  if(wsReady) ws.send(JSON.stringify({type:'interrupt'}));
  setMode(wantMic?'listening':'idle');
};

// ============================================================= approval modal
let currentApproval=null;
function askApproval(m){
  currentApproval = m.id;
  document.getElementById('mName').textContent = m.name;
  document.getElementById('mDetail').textContent = m.detail;
  document.getElementById('modal').classList.add('show');
}
function answer(ok){
  if(currentApproval && wsReady)
    ws.send(JSON.stringify({type:'approve', id:currentApproval, ok}));
  currentApproval=null; document.getElementById('modal').classList.remove('show');
}
document.getElementById('mAllow').onclick=()=>answer(true);
document.getElementById('mDeny').onclick=()=>answer(false);

// ============================================================= wake
document.querySelector('.stage').addEventListener('click', ()=>{
  if(!audioCtx){ setMic(true); document.getElementById('hint').textContent=''; }
});
document.getElementById('hint').textContent = SR ? '' : 'tip: use Chrome for voice input';
connect();
</script>
</body>
</html>
